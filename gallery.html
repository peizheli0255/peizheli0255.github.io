<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Peizhe Li</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-shell">
      <a class="brand" href="index.html">Peizhe Li's Homepage</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html#about" data-i18n="navAbout">关于</a>
        <a href="index.html#research" data-i18n="navResearch">科研</a>
        <a href="index.html#life" data-i18n="navLife">博客</a>
        <a href="songs.html" data-i18n="navAlbums">歌曲</a>
        <a href="anime.html" data-i18n="navAnime">动漫</a>
        <a href="index.html#crafts" data-i18n="navCrafts">手作</a>
        <a href="gallery.html" data-i18n="navGallery">相册</a>
      </nav>
      <div class="control-row">
        <button class="icon-button language-button" id="languageButton" type="button" aria-label="Switch language" title="Switch language"><img src="assets/icons/earth.svg" alt="" aria-hidden="true">
          <span id="languageLabel">中</span>
        </button>
        <button class="theme-switch" id="themeButton" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span></span></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="gallery-hero">
      <p class="kicker">Photo Archive</p>
      <h1 data-i18n="galleryTitle">相册</h1>
      <div data-lang-panel="zh" class="active">
        <p data-i18n="galleryIntro">这里是独立相册页。你可以从首页进入指定栏目，也可以从顶部相册入口查看全部照片分类。</p>
      </div>
      <div data-lang-panel="en">
        <p data-i18n="galleryIntro">This is an independent gallery page. You can jump to a specific category from the homepage, or enter from the top navigation to browse all categories.</p>
      </div>
      <div class="gallery-tabs">
        <a href="#crafts" data-i18n="galleryCrafts">手工作品</a>
        <a href="#other-photos" data-i18n="galleryOther">其它照片</a>
      </div>
    </section>

    <section class="gallery-category" id="crafts">
      <h2 class="section-title" data-i18n="galleryCrafts">手工作品</h2>
      <div class="gallery-grid" aria-label="Handmade works gallery">
        <a class="gallery-card" href="details/craft-1.html"><figure>
          <img src="assets/crafts/work-1.jpg" alt="Handmade work" onerror="this.src='https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Handmade Work 01 · 2026</figcaption>
        </figure></a>
        <a class="gallery-card" href="details/craft-2.html"><figure>
          <img src="assets/crafts/work-2.jpg" alt="Handmade work" onerror="this.src='https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Handmade Work 02 · 2026</figcaption>
        </figure></a>
        <a class="gallery-card" href="details/craft-3.html"><figure>
          <img src="assets/crafts/work-3.jpg" alt="Handmade work" onerror="this.src='https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Handmade Work 03 · 2026</figcaption>
        </figure></a>
      </div>
    </section>

    <section class="gallery-category" id="other-photos">
      <h2 class="section-title" data-i18n="galleryOther">其它照片</h2>
      <div class="gallery-grid" aria-label="Other photos gallery">
        <figure>
          <img src="assets/gallery/other/photo-1.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 01 · 2024</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/other/photo-2.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 02 · 2024</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/other/photo-3.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 03 · 2023</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/other/photo-4.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 04 · 2026</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/other/photo-5.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 05 · 2026</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/other/photo-6.jpg" alt="Gallery photo" onerror="this.src='https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?auto=format&fit=crop&w=800&q=80'">
          <figcaption>Other Photo 06 · 2026</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
